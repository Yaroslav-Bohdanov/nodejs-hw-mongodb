type: object
required:
  - _id
  - name
  - email
  - phone
properties:
  _id:
    description: "Contact's unique ID"
    type: string
    example: '65ca67e7ae7f10c88b598384'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's email"
    type: string
    example: 'john.doe@example.com'
  phone:
    description: "Contact's phone number"
    type: string
    example: '+380981234567'
