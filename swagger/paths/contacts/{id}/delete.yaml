tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContact
description: 'Delete contact by its unique ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '204':
    description: Successfully deleted contact
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact with id 65ca67e7ae7f10c88b598384 not found!
            data:
              type: object
              properties:
                message:
                  type: string
                  example: 'No contact found with the provided ID'
  '401':
    $ref: '../../../components/responses/401.yaml'
