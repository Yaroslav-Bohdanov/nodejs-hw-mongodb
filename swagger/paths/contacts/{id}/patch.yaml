tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Update contact details by its unique ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Jane Doe'
          email:
            type: string
            example: 'jane.doe@example.com'
          phone:
            type: string
            example: '+380981234567'
        required:
          - name
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact with id 65ca67e7ae7f10c88b598384 not found!
            data:
              type: object
              properties:
                message:
                  type: string
                  example: 'No contact found with the provided ID'
  '401':
    $ref: '../../../components/responses/401.yaml'
