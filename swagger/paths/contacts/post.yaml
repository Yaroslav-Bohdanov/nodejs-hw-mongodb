tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided data
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            example: 'john.doe@example.com'
          phone:
            type: string
            example: '+380981234567'
responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a new contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Missing required fields!
            data:
              type: object
              properties:
                message:
                  type: string
                  example: 'Name, email, and phone are required'
  '401':
    $ref: '../../components/responses/401.yaml'
